name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/SurpriseConfettiShower/SurpriseConfettiShower.csproj -c Release

      - name: Test
        run: dotnet test tests/SurpriseConfettiShower.Tests/SurpriseConfettiShower.Tests.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained exe
        run: dotnet publish src/SurpriseConfettiShower -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      # Same app without the bundled runtime: ~240 KB instead of ~72 MB, but the machine needs
      # the .NET Desktop Runtime installed.
      - name: Publish framework-dependent exe
        run: |
          dotnet publish src/SurpriseConfettiShower -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o publish-fd
          Move-Item publish-fd/SurpriseConfettiShower.exe publish/SurpriseConfettiShower-framework-dependent.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/SurpriseConfettiShower.exe
            publish/SurpriseConfettiShower-framework-dependent.exe
